name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      # E2E mocks the API with page.route(), so no backend is needed.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
